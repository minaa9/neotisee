<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Analytics 4 en mode consentement : le consentement par défaut est posé AVANT la balise.
         Rien n'est collecté tant que le visiteur n'a pas accepté (choix gardé 12 mois). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      (function () {
        var granted = false;
        try {
          var saved = JSON.parse(localStorage.getItem('neotisse-cookies'));
          granted = !!(saved && saved.audience && Date.now() - saved.date <= 31536000000);
        } catch (e) {}
        gtag('consent', 'default', {
          analytics_storage: granted ? 'granted' : 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
        // Balise GA4 (propriété « Néotisse vibecoding »), jamais chargée en local.
        if (!/^(localhost|127\.|\[::1\])/.test(location.hostname)) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-G6EEVQB8N4';
          document.head.appendChild(s);
          gtag('js', new Date());
          gtag('config', 'G-G6EEVQB8N4');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Néotisse · Savoir-faire textiles anciens</title>
    <meta
      name="description"
      content="Néotisse, association montpelliéraine d'archéologie expérimentale : ateliers de filage, tissage, teinture végétale et broderie, du Néolithique au Moyen Âge."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
