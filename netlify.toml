# Déploiement Netlify : construit le site avec Vite et publie le dossier dist.
[build]
  command = "npm run build"
  publish = "dist"

# Site à une seule page (React Router) : toutes les adresses renvoient vers index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité, sur toutes les pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Espace de gestion : jamais dans les moteurs de recherche, jamais en cache.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
